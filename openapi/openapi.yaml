openapi: 3.1.0
info:
  title: Meridian Wealth Dashboard API
  version: 0.2.0
  description: |
    Shared contract for the implemented account, current-cash, and property
    workflows in docs/product-design.md and docs/architecture.md (baseline
    v1.4), including the property slice described in the current domain model.
    Operation-level x-implementation-status distinguishes implemented operations
    from planned ones. See README.md beside this file for scope, implementation
    sequencing, and deferred product decisions.

    This is the current unauthenticated, single-process personal workspace API.
    Every operation is public; no credentials, user identity, ownership checks,
    rate limiting, or correlation-ID headers are implemented or promised.
    Authentication must be designed before introducing multi-user access.
    Storage is currently in-memory and is lost on process restart.

    Account IDs returned by the server are lowercase hyphenated UUIDs. Clients
    should send this canonical representation. Names are trimmed using Go
    strings.TrimSpace, must remain nonempty, and need not be unique.

    Money is transmitted as exact non-negative decimal strings, never JSON
    numbers. USD and SGD have two minor-unit digits; VND has zero. The maximum
    value is 9223372036854775807 minor units. No timestamps, historical balances,
    FX conversion, or inferred reporting totals are part of these resources.

    Collections are complete, unpaginated snapshots with deterministic ordering.
    No filtering, sorting parameters, or pagination parameters are supported;
    existing handlers ignore query parameters. Empty collections return arrays,
    never null. Requests and resources have no semantically nullable fields.

    Existing handlers decode one JSON value, ignore unknown object members, and
    do not enforce Content-Type or reject trailing JSON values. Clients must
    send a single application/json object using the documented fields. Missing
    or null required string fields are treated as empty and fail validation.
    Tightening this decoder behavior requires an explicit compatibility change.

    Successful product responses use application/json. Errors preserve the
    shipped text/plain; charset=utf-8 format, including a trailing newline.
    There is no JSON error envelope or structured field-violation payload.
    Named error schemas enumerate exact wire messages for client error states.
    Unsupported methods on a known path return 405 with Allow; unknown paths
    return 404 with the Go router body "404 page not found\n". Go also serves
    HEAD for each implemented GET, with the same status and no response body.

    Writes are synchronous. Account creation is not idempotent: retrying it
    creates another account even when the name is identical. Cash PUT is an
    idempotent replacement by (account ID, currency), with last completed save
    winning concurrent writes. There are no ETag, If-Match, or Idempotency-Key
    guarantees. Clients should reload cash after uncertain or concurrent writes.

    Properties are standalone physical-asset aggregates with named real-estate
    interests and manually entered current values. Each record represents the user's
    owned share of one property independently of any account. Its value is
    the estimated gross market value of that share, before any mortgage or
    other liability; it is neither a purchase price nor a cash balance. Property
    is implicitly the asset class. Names are not unique and no physical-property
    deduplication is promised.
    Values use the existing supported currencies and exact money limits. There
    is no ownership-percentage calculation, price feed, FX conversion, valuation
    history, or net-worth total in this slice. Property creation, listing, and
    value replacement are implemented and used by the frontend. A future Asset
    read projection may combine properties, cash, and account-held positions for
    reporting; no shared Asset interface, generic storage, aggregation, or FX
    behavior is introduced by this contract.
servers:
  - url: /
    description: API origin; use http://localhost:8080 for the current local Go server.
security: []
tags:
  - name: Accounts
    description: Create and discover custody containers for cash and future account-held positions.
  - name: Cash
    description: Set and view current cash balances within an account.
  - name: Properties
    description: Creation, discovery, and manual valuation of directly owned property aggregates.
  - name: Health
    description: Process liveness and shutdown readiness.
paths:
  /api/v1/accounts:
    post:
      tags: [Accounts]
      operationId: createAccount
      summary: Create an account
      description: |
        Trims the name and creates a new server-generated UUID. Duplicate names
        are allowed. Returns the representation without a Location header.
        Do not automatically retry after an ambiguous network failure.
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
            examples:
              trimmedName:
                value: {name: '  HSBC Premier  '}
      responses:
        '201':
          description: Account created; name has been trimmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              example:
                id: 123e4567-e89b-42d3-a456-426614174000
                name: HSBC Premier
        '400':
          description: JSON decoding failed, or the name is missing, null, empty, or whitespace-only.
          content:
            text/plain; charset=utf-8:
              schema:
                $ref: '#/components/schemas/CreateAccountError'
              examples:
                malformedRequest:
                  value: "invalid request\n"
                invalidName:
                  value: "account name cannot be empty\n"
        '405':
          $ref: '#/components/responses/AccountsMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: List all accounts
      description: |
        Returns every account, ordered lexically by canonical UUID ascending;
        names are not unique sort keys. No query parameters are supported.
        Return {"accounts": []} when empty.
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: Complete account collection, including an empty collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountList'
              examples:
                accounts:
                  value:
                    accounts:
                      - id: 123e4567-e89b-42d3-a456-426614174000
                        name: HSBC Premier
                empty:
                  value: {accounts: []}
        '405':
          $ref: '#/components/responses/AccountsMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/accounts/{id}:
    parameters:
      - $ref: '#/components/parameters/AccountID'
    get:
      tags: [Accounts]
      operationId: getAccountById
      summary: Retrieve an account by ID
      description: Validates the ID before looking up the account.
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: Account found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              example:
                id: 123e4567-e89b-42d3-a456-426614174000
                name: HSBC Premier
        '400':
          $ref: '#/components/responses/InvalidAccountID'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '405':
          $ref: '#/components/responses/ReadMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/accounts/{id}/cash:
    parameters:
      - $ref: '#/components/parameters/AccountID'
    get:
      tags: [Cash]
      operationId: listCashBalances
      summary: List current cash balances for an account
      description: |
        Verifies account existence and returns all its balances sorted by
        currency ascending (SGD, USD, VND), with at most one per currency.
        An existing account with no balances returns 200 with an empty array;
        a missing account returns 404. Zero balances remain in the collection.
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: Complete current-cash collection for the account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashBalanceList'
              examples:
                multipleCurrencies:
                  value:
                    balances:
                      - {currency: SGD, amount: '2500.00'}
                      - {currency: USD, amount: '1234.56'}
                      - {currency: VND, amount: '1000000'}
                empty:
                  value: {balances: []}
        '400':
          $ref: '#/components/responses/InvalidAccountID'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '405':
          $ref: '#/components/responses/ReadMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/accounts/{id}/cash/{currency}:
    parameters:
      - $ref: '#/components/parameters/AccountID'
      - $ref: '#/components/parameters/CashCurrency'
    put:
      tags: [Cash]
      operationId: setCashBalance
      summary: Create or replace a current cash balance
      description: |
        Replaces the balance identified by account ID and normalized currency;
        both first creation and replacement return 200. Zero is a stored amount,
        not deletion. The response contains currency and amount, not account ID.

        Validation order is account-ID syntax, currency, JSON decoding, amount,
        then account existence. Consequently invalid amounts return 400 even
        when the syntactically valid account ID does not exist.

        After trimming Go Unicode whitespace, USD/SGD input must match
        ^[0-9]+(\.[0-9]{1,2})?$ and VND input must match ^[0-9]+$.
        Leading zeroes are accepted. Signs, exponents, grouping separators,
        missing integer/fraction digits, and excess precision are rejected.
        USD/SGD cannot exceed 92233720368547758.07; VND cannot exceed
        9223372036854775807. These cross-parameter and exact numeric-string
        limits must be checked by the server and forms in addition to schema
        validation. Values must never pass through floating-point arithmetic.
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetCashBalanceRequest'
            examples:
              usd:
                summary: Set USD or SGD with two decimal places
                value: {amount: '1234.56'}
              vnd:
                summary: Set VND with no fractional digits
                value: {amount: '1000000'}
              zero:
                summary: Replace the current amount with zero
                value: {amount: '0'}
              normalized:
                summary: Whitespace and leading zeroes are accepted
                value: {amount: ' 0012.3 '}
      responses:
        '200':
          description: Balance created or replaced; amount and currency are canonical.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashBalance'
              examples:
                usd:
                  value: {currency: USD, amount: '1234.56'}
                vnd:
                  value: {currency: VND, amount: '1000000'}
                zero:
                  value: {currency: USD, amount: '0.00'}
                normalized:
                  value: {currency: SGD, amount: '12.30'}
        '400':
          description: Invalid account ID, unsupported currency, JSON decoding failure, or invalid amount.
          content:
            text/plain; charset=utf-8:
              schema:
                $ref: '#/components/schemas/SetCashBalanceError'
              examples:
                invalidID:
                  value: "invalid account ID\n"
                unsupportedCurrency:
                  summary: For example, currency GBP
                  value: "unsupported currency\n"
                malformedRequest:
                  summary: For example, a JSON number instead of an amount string
                  value: "invalid request\n"
                invalidAmount:
                  summary: For example, -1.00, 1.001 USD, or 1.00 VND
                  value: "invalid amount\n"
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '405':
          description: Unsupported method on this path (only PUT is allowed).
          headers:
            Allow:
              required: true
              schema: {type: string, const: PUT}
          content:
            text/plain; charset=utf-8:
              schema:
                $ref: '#/components/schemas/MethodNotAllowedError'
              example: "Method Not Allowed\n"
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/properties:
    post:
      tags: [Properties]
      operationId: createProperty
      summary: Create a standalone property asset
      description: |
        Creates a server-generated property UUID with a trimmed, nonempty name
        and an initial manual value. Duplicate names are allowed. The value
        describes only the user's owned share, before liabilities. No account
        is created, looked up, or associated with the property.

        Validation order is JSON decoding, name, value object, currency, then
        amount. Missing, null, or non-object value returns invalid request.
        Unknown object members are ignored. Amount
        validation and normalization match cash; currency must be one of the
        documented uppercase codes. No record is saved on validation failure.

        Returns 201 with the complete property and no Location header. Creation
        is not idempotent, even for identical inputs; do not automatically retry
        after an ambiguous network failure. This slice provides creation,
        listing, and value replacement.
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePropertyRequest'
            examples:
              ownedShare:
                summary: Manually estimated value of the user's share of a home
                value:
                  name: '  Singapore home  '
                  value: {currency: SGD, amount: '750000'}
      responses:
        '201':
          description: Property created with a canonical ID, trimmed name, and canonical value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
              example:
                id: 223e4567-e89b-42d3-a456-426614174000
                name: Singapore home
                value: {currency: SGD, amount: '750000.00'}
        '400':
          description: Invalid JSON, name, value object, currency, or amount.
          content:
            text/plain; charset=utf-8:
              schema:
                $ref: '#/components/schemas/CreatePropertyError'
              examples:
                malformedRequest:
                  value: "invalid request\n"
                invalidName:
                  value: "property name cannot be empty\n"
                unsupportedCurrency:
                  value: "unsupported currency\n"
                invalidAmount:
                  value: "invalid amount\n"
        '405':
          $ref: '#/components/responses/PropertiesMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [Properties]
      operationId: listProperties
      summary: List all current property assets
      description: |
        Returns every property in the workspace ordered by canonical property
        UUID ascending, each ID appearing once. Names are not unique sort keys.
        A workspace with no properties returns {"properties": []}. Properties
        valued at zero remain listed.
        The collection is complete and unpaginated with no query parameters.
        Values are user estimates in their stated currencies, with no total.
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: Complete workspace property collection, including an empty collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyList'
              examples:
                properties:
                  value:
                    properties:
                      - id: 223e4567-e89b-42d3-a456-426614174000
                        name: Singapore home
                        value: {currency: SGD, amount: '750000.00'}
                empty:
                  value: {properties: []}
        '405':
          $ref: '#/components/responses/PropertiesMethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/properties/{propertyId}/value:
    parameters:
      - $ref: '#/components/parameters/PropertyID'
    put:
      tags: [Properties]
      operationId: setPropertyValue
      summary: Replace a property's current manual value
      description: |
        Atomically replaces the currency and amount on an existing property,
        returning the complete property. A change of currency supplies a new
        manual estimate; the server performs no conversion. Identity and name
        remain fixed. Zero is a stored value, not deletion.
        This operation does not create a missing property.

        Validation order is property-ID syntax, JSON decoding, currency, amount,
        then property lookup. A valid property ID absent from the workspace
        returns property not found.
        Unknown object members are ignored. Currency must be a documented
        uppercase code; amount validation and normalization match cash.

        The write is synchronous and idempotent, with the last completed save
        winning concurrent writes. There are no conditional-write guarantees.
        Reload the property collection after uncertain or concurrent writes;
        retrying may overwrite another edit. Only the current value is retained.
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyValueInput'
            examples:
              revisedEstimate:
                value: {currency: SGD, amount: ' 0800000.5 '}
              wholeUnits:
                value: {currency: VND, amount: '5000000000'}
              zero:
                value: {currency: SGD, amount: '0'}
      responses:
        '200':
          description: Property with its replaced, canonical current value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
              examples:
                revisedEstimate:
                  value:
                    id: 223e4567-e89b-42d3-a456-426614174000
                    name: Singapore home
                    value: {currency: SGD, amount: '800000.50'}
                zero:
                  value:
                    id: 223e4567-e89b-42d3-a456-426614174000
                    name: Singapore home
                    value: {currency: SGD, amount: '0.00'}
        '400':
          description: Invalid property ID, JSON, currency, or amount.
          content:
            text/plain; charset=utf-8:
              schema:
                $ref: '#/components/schemas/SetPropertyValueError'
              examples:
                invalidPropertyID:
                  value: "invalid property ID\n"
                malformedRequest:
                  value: "invalid request\n"
                unsupportedCurrency:
                  value: "unsupported currency\n"
                invalidAmount:
                  value: "invalid amount\n"
        '404':
          description: Property not present in the workspace.
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
                const: "property not found\n"
              examples:
                missingProperty:
                  value: "property not found\n"
        '405':
          description: Unsupported method on this path (only PUT is allowed).
          headers:
            Allow:
              required: true
              schema: {type: string, const: PUT}
          content:
            text/plain; charset=utf-8:
              schema:
                $ref: '#/components/schemas/MethodNotAllowedError'
              example: "Method Not Allowed\n"
        '500':
          $ref: '#/components/responses/InternalServerError'
  /livez:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Check process liveness
      description: Returns OK while serving, including during graceful shutdown draining.
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
        '405':
          $ref: '#/components/responses/ReadMethodNotAllowed'
  /readyz:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Check readiness to receive traffic
      description: |
        Returns OK normally and 503 once shutdown starts. This checks process
        shutdown state only, not storage or external dependencies. No Retry-After
        header is returned; an instance entering shutdown will not recover.
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
        '405':
          $ref: '#/components/responses/ReadMethodNotAllowed'
        '503':
          description: Graceful shutdown has begun; body has no trailing newline.
          content:
            text/plain; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ReadinessUnavailable'
              example: shutting down
components:
  parameters:
    AccountID:
      name: id
      in: path
      required: true
      description: |
        Account identity. Use the lowercase hyphenated UUID returned by create.
        For compatibility the current google/uuid parser also accepts uppercase,
        32 hexadecimal digits, urn:uuid-prefixed, and brace-wrapped UUID forms.
        All parseable UUIDs (including the zero UUID) proceed to lookup; absence
        returns 404. Invalid syntax returns 400. The pattern models supported
        input spellings rather than restricting input to format uuid.
      schema:
        type: string
        pattern: '^(?:[0-9a-fA-F]{32}|(?:[uU][rR][nN]:[uU][uU][iI][dD]:)?[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}|\{[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\})$'
      example: 123e4567-e89b-42d3-a456-426614174000
    PropertyID:
      name: propertyId
      in: path
      required: true
      description: |
        Server-generated property identity, distinct from account identity.
        Use a canonical lowercase hyphenated UUID; other spellings return 400.
        A valid UUID absent from the workspace returns 404.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      example: 223e4567-e89b-42d3-a456-426614174000
    CashCurrency:
      name: currency
      in: path
      required: true
      description: |
        USD, SGD, or VND. The server trims Go Unicode whitespace and normalizes
        case. Clients should send uppercase ISO 4217 codes. Percent-encode any
        whitespace in a URL. Unsupported codes return 400.
      schema:
        type: string
        pattern: '^[\t\n\v\f\r \u0085\u00a0\u1680\u2000-\u200a\u2028\u2029\u202f\u205f\u3000]*(?:[uU][sS][dD]|[sS][gG][dD]|[vV][nN][dD])[\t\n\v\f\r \u0085\u00a0\u1680\u2000-\u200a\u2028\u2029\u202f\u205f\u3000]*$'
      example: USD
  schemas:
    CreateAccountRequest:
      type: object
      description: |
        Only name is consumed. Unknown members are ignored by the existing
        decoder; they are not persisted. Validation applies after trimming Go
        Unicode whitespace. There is no implemented maximum name length.
      additionalProperties: true
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          pattern: '[^\t\n\v\f\r \u0085\u00a0\u1680\u2000-\u200a\u2028\u2029\u202f\u205f\u3000]'
          description: Human-readable name containing at least one non-whitespace character.
    Account:
      type: object
      additionalProperties: false
      required: [id, name]
      description: Custody container for cash and future account-held positions; directly owned properties are separate aggregates.
      properties:
        id:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          readOnly: true
          description: Server-generated stable account identity.
        name:
          type: string
          minLength: 1
          description: Name with leading and trailing Go Unicode whitespace removed.
    AccountList:
      type: object
      additionalProperties: false
      required: [accounts]
      properties:
        accounts:
          type: array
          uniqueItems: true
          description: All accounts ordered by canonical UUID ascending, each ID appearing once.
          items:
            $ref: '#/components/schemas/Account'
    SetCashBalanceRequest:
      type: object
      additionalProperties: true
      description: Only amount is consumed; unknown members are ignored, not persisted.
      required: [amount]
      properties:
        amount:
          type: string
          minLength: 1
          pattern: '^[\t\n\v\f\r \u0085\u00a0\u1680\u2000-\u200a\u2028\u2029\u202f\u205f\u3000]*[0-9]+(?:\.[0-9]{1,2})?[\t\n\v\f\r \u0085\u00a0\u1680\u2000-\u200a\u2028\u2029\u202f\u205f\u3000]*$'
          description: |
            Exact non-negative decimal amount. The currency path parameter
            further forbids any fractional part for VND. Maximum after scaling
            is 9223372036854775807 minor units; compare using integer/decimal
            arithmetic. Whitespace and leading zeroes are accepted; no input
            length cap is imposed by the current implementation.
    CashBalance:
      description: |
        Current cash for the account in the request path; the currency is the
        account-local key. Amount is canonical and at most int64 max minor units.
      oneOf:
        - $ref: '#/components/schemas/TwoDecimalCashBalance'
        - $ref: '#/components/schemas/WholeUnitCashBalance'
    TwoDecimalCashBalance:
      type: object
      additionalProperties: false
      required: [currency, amount]
      description: USD or SGD cash with two fractional digits and a maximum of 92233720368547758.07.
      properties:
        currency:
          type: string
          enum: [USD, SGD]
        amount:
          type: string
          pattern: '^(0|[1-9][0-9]{0,16})\.[0-9]{2}$'
          maxLength: 20
          description: Canonical exact amount; the numeric-string upper bound also requires decimal validation.
    WholeUnitCashBalance:
      type: object
      additionalProperties: false
      required: [currency, amount]
      description: VND cash with no fractional digits and a maximum of 9223372036854775807.
      properties:
        currency:
          type: string
          const: VND
        amount:
          type: string
          pattern: '^(0|[1-9][0-9]{0,18})$'
          maxLength: 19
          description: Canonical exact amount; the numeric-string upper bound also requires integer validation.
    CashBalanceList:
      type: object
      additionalProperties: false
      required: [balances]
      properties:
        balances:
          type: array
          maxItems: 3
          uniqueItems: true
          description: Ordered by currency ascending, at most one balance per currency.
          items:
            $ref: '#/components/schemas/CashBalance'
    CreatePropertyRequest:
      type: object
      additionalProperties: true
      description: Only name and value are consumed; unknown members are ignored, not persisted.
      required: [name, value]
      properties:
        name:
          type: string
          minLength: 1
          pattern: '[^\t\n\v\f\r \u0085\u00a0\u1680\u2000-\u200a\u2028\u2029\u202f\u205f\u3000]'
          description: Trimmed using Go strings.TrimSpace; must remain nonempty. Names need not be unique.
        value:
          $ref: '#/components/schemas/PropertyValueInput'
    PropertyValueInput:
      type: object
      additionalProperties: true
      required: [currency, amount]
      description: |
        Manual gross market value of the user's owned share, before liabilities.
        Only currency and amount are consumed. Missing or null currency returns
        unsupported currency; missing or null amount returns invalid amount.
        Non-string field values or a non-object body return invalid request.
      properties:
        currency:
          type: string
          enum: [USD, SGD, VND]
          description: Exact uppercase denomination of the estimate; no FX conversion is performed.
        amount:
          type: string
          minLength: 1
          pattern: '^[\t\n\v\f\r \u0085\u00a0\u1680\u2000-\u200a\u2028\u2029\u202f\u205f\u3000]*[0-9]+(?:\.[0-9]{1,2})?[\t\n\v\f\r \u0085\u00a0\u1680\u2000-\u200a\u2028\u2029\u202f\u205f\u3000]*$'
          description: |
            Exact non-negative decimal string using cash amount parsing rules.
            Trim Go Unicode whitespace and accept leading zeroes. USD/SGD allow
            up to two fractional digits and at most 92233720368547758.07; VND
            allows no fractional part and at most 9223372036854775807. Reject
            signs, exponents, separators, excess precision, and overflow. Check
            currency precision and bounds using integer/decimal arithmetic in
            addition to schema validation. Zero is valid.
    PropertyValue:
      description: Canonical manual current value; never a cash balance or an inferred net value.
      oneOf:
        - type: object
          additionalProperties: false
          required: [currency, amount]
          properties:
            currency:
              type: string
              enum: [USD, SGD]
            amount:
              type: string
              pattern: '^(0|[1-9][0-9]{0,16})\.[0-9]{2}$'
              maxLength: 20
              description: Canonical exact amount, at most 92233720368547758.07; also requires decimal validation.
        - type: object
          additionalProperties: false
          required: [currency, amount]
          properties:
            currency:
              type: string
              const: VND
            amount:
              type: string
              pattern: '^(0|[1-9][0-9]{0,18})$'
              maxLength: 19
              description: Canonical exact amount, at most 9223372036854775807; also requires integer validation.
    Property:
      type: object
      additionalProperties: false
      required: [id, name, value]
      description: |
        A directly owned real-estate interest independent of any custody account.
        Each property has one current manual value. Asset class is implicitly Property;
        mortgages and other liabilities are not included in this resource.
      properties:
        id:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          readOnly: true
          description: Stable server-generated property identity.
        name:
          type: string
          minLength: 1
          description: Name with leading and trailing Go Unicode whitespace removed.
        value:
          $ref: '#/components/schemas/PropertyValue'
    PropertyList:
      type: object
      additionalProperties: false
      required: [properties]
      properties:
        properties:
          type: array
          uniqueItems: true
          description: All properties in the workspace ordered by canonical property UUID ascending, each ID appearing once.
          items:
            $ref: '#/components/schemas/Property'
    CreatePropertyError:
      type: string
      enum: ["invalid request\n", "property name cannot be empty\n", "unsupported currency\n", "invalid amount\n"]
      description: Validation failure; exact message identifies the input to correct.
    SetPropertyValueError:
      type: string
      enum: ["invalid property ID\n", "invalid request\n", "unsupported currency\n", "invalid amount\n"]
      description: Validation failure; exact message identifies the input to correct.
    CreateAccountError:
      type: string
      enum: ["invalid request\n", "account name cannot be empty\n"]
      description: Decode failure or name validation failure; wire text includes a newline.
    SetCashBalanceError:
      type: string
      enum: ["invalid account ID\n", "unsupported currency\n", "invalid request\n", "invalid amount\n"]
      description: Validation failure; exact message identifies the input to correct.
    InvalidAccountIDError:
      type: string
      const: "invalid account ID\n"
    AccountNotFoundError:
      type: string
      const: "account not found\n"
    InternalServerError:
      type: string
      const: "internal server error\n"
    MethodNotAllowedError:
      type: string
      const: "Method Not Allowed\n"
    HealthOK:
      type: string
      const: OK
    ReadinessUnavailable:
      type: string
      const: shutting down
  responses:
    InvalidAccountID:
      description: The path ID cannot be parsed as an account UUID.
      content:
        text/plain; charset=utf-8:
          schema:
            $ref: '#/components/schemas/InvalidAccountIDError'
          example: "invalid account ID\n"
    AccountNotFound:
      description: The UUID is syntactically valid but no account exists with that identity.
      content:
        text/plain; charset=utf-8:
          schema:
            $ref: '#/components/schemas/AccountNotFoundError'
          example: "account not found\n"
    InternalServerError:
      description: Unexpected repository failure; internal details are not exposed.
      content:
        text/plain; charset=utf-8:
          schema:
            $ref: '#/components/schemas/InternalServerError'
          example: "internal server error\n"
    AccountsMethodNotAllowed:
      description: |
        Unsupported method on the collection path. Allow is GET, HEAD, POST.
        Supported methods do not otherwise return this response.
      headers:
        Allow:
          required: true
          schema:
            type: string
            enum: [POST, 'GET, HEAD, POST']
      content:
        text/plain; charset=utf-8:
          schema:
            $ref: '#/components/schemas/MethodNotAllowedError'
          example: "Method Not Allowed\n"
    PropertiesMethodNotAllowed:
      description: Unsupported method on the property collection path; GET, HEAD, and POST are allowed.
      headers:
        Allow:
          required: true
          schema: {type: string, const: 'GET, HEAD, POST'}
      content:
        text/plain; charset=utf-8:
          schema:
            $ref: '#/components/schemas/MethodNotAllowedError'
          example: "Method Not Allowed\n"
    ReadMethodNotAllowed:
      description: Unsupported method on this path; GET and HEAD are allowed.
      headers:
        Allow:
          required: true
          schema: {type: string, const: 'GET, HEAD'}
      content:
        text/plain; charset=utf-8:
          schema:
            $ref: '#/components/schemas/MethodNotAllowedError'
          example: "Method Not Allowed\n"
    Healthy:
      description: Process check passed; body has no trailing newline.
      content:
        text/plain; charset=utf-8:
          schema:
            $ref: '#/components/schemas/HealthOK'
          example: OK
