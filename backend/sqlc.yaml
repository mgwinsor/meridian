version: "2"
sql:
  - engine: postgresql
    schema: internal/database/migrations
    queries: internal/account/queries.sql
    gen:
      go:
        package: postgres
        out: internal/account/postgres
        sql_package: pgx/v5
        omit_unused_structs: true
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
  - engine: postgresql
    schema: internal/database/migrations
    queries: internal/instrument/queries.sql
    gen:
      go:
        package: postgres
        out: internal/instrument/postgres
        sql_package: pgx/v5
        omit_unused_structs: true
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
  - engine: postgresql
    schema: internal/database/migrations
