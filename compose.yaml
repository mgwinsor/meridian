---
services:
  db:
    image: postgres:18
    container_name: meridian-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: meridian

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealth -d wealth"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
